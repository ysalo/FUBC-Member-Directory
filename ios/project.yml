name: ChurchDirectory
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Staging: debug
  Release: release
configFiles:
  Debug: Configuration/Base.xcconfig
  Staging: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.39.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ChurchDirectory:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_KEY_CFBundleDisplayName: Church Directory
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: Add an appointment you choose to your calendar.
        INFOPLIST_KEY_SupabaseHost: $(SUPABASE_HOST)
        INFOPLIST_KEY_SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        INFOPLIST_KEY_SupportEmail: $(SUPPORT_EMAIL)
        INFOPLIST_KEY_SupportURL: https://$(SUPPORT_HOST)
        INFOPLIST_KEY_PrivacyURL: https://$(PRIVACY_HOST)
      configs:
        Debug:
          INFOPLIST_KEY_AppMode: demo
        Staging:
          INFOPLIST_KEY_AppMode: live
          CODE_SIGN_ENTITLEMENTS: Configuration/ChurchDirectory.entitlements
          APNS_ENVIRONMENT: development
          INFOPLIST_KEY_APNSEnvironment: sandbox
        Release:
          INFOPLIST_KEY_AppMode: live
          CODE_SIGN_ENTITLEMENTS: Configuration/ChurchDirectory.entitlements
          APNS_ENVIRONMENT: production
          INFOPLIST_KEY_APNSEnvironment: production
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [churchdirectory]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  ChurchDirectoryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ChurchDirectory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.churchdirectory.tests
schemes:
  ChurchDirectoryPreview:
    build:
      targets:
        ChurchDirectory: all
        ChurchDirectoryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ChurchDirectoryTests]
    archive:
      config: Release
  ChurchDirectory:
    build:
      targets:
        ChurchDirectory: all
    run:
      config: Staging
    test:
      config: Staging
      targets: [ChurchDirectoryTests]
    archive:
      config: Release
