name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: family-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FAMILY_TEST_DATABASE_URL: postgres://postgres:family-test@localhost:5432/postgres
      FAMILY_TEST_SAFEUPDATE_LIBRARY: safeupdate
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL test client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Enable production write guard in test database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/eradman/pg-safeupdate/37dbc9c4acf5e2504adf2b218e9c6b41751022f3/safeupdate.c --output /tmp/safeupdate.c
          docker cp /tmp/safeupdate.c "$PG_CONTAINER:/tmp/safeupdate.c"
          docker exec "$PG_CONTAINER" sh -ceu '
            apt-get update
            apt-get install -y --no-install-recommends gcc libc6-dev postgresql-server-dev-18
            gcc -shared -fPIC -I"$(pg_config --includedir-server)" /tmp/safeupdate.c -o "$(pg_config --pkglibdir)/safeupdate.so"
          '
      - name: Verify application
        run: pnpm verify
